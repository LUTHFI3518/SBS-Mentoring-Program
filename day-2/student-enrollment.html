<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
</head>

<body>
    <h1>Student Enrollment Form</h1>

    <form action="/submit" method="POST">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <label for="student-id">Student ID:</label>
        <input type="number" id="student-id" name="student-id" min="1" required>

        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <p>Skills:</p>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>

        <input type="checkbox" id="python" name="skills" value="python">
        <label for="python">Python</label>
        <br><br>
        <label for="department">Department:</label>

        <select id="department" name="department" required>
    <option value="">Select Department</option>
    <option value="cse">Computer Science</option>
    <option value="ece">Electronics & Communication</option>
    <option value="eee">Electrical & Electronics</option>
    <option value="me">Mechanical</option>
    <option value="ce">Civil</option>


</select>
        <label for="address">Address:</label>
        <br>

        <textarea id="address" name="address" rows="5" cols="40" placeholder="Enter your full address"></textarea>
        <br><br>
        <label for="document">Upload Document:</label>
        <input type="file" id="document" name="document">

        <br><br>

        <label for="interest">Interest in Technology:</label>
        <input type="range" id="interest" name="interest" min="0" max="100">

        <br><br>

        <label for="color">Preferred Color:</label>
        <input type="color" id="color" name="color">

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
</body>

</html>
